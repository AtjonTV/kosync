services:
  kosync:
    #build:
    #  dockerfile: deployment/Dockerfile
    #  context: ..
    image: docker.obth.eu/atjontv/kosync:latest
    pull_policy: daily # If this fails for your compose version, replace with 'always'
    container_name: kosync
    restart: unless-stopped
    environment:
      ENABLE_WEBUI: "true"
    volumes:
      # PocketBase keeps the database, the uploads and its backups in here.
      - ./data:/pb_data
    #ports:
    #  - "8080:8080"
