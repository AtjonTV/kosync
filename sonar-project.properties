sonar.projectKey=atjontv_kosync_0afbdd8e-9f93-4f56-821e-4ddf22b7a4b6
sonar.qualitygate.wait=true

sonar.sources=server,webui/src
sonar.tests=server,webui/src/tests
sonar.test.inclusions=**/*_test.go,webui/src/tests/**
sonar.exclusions=bearer-report.html,**/*_test.go,webui/src/tests/**

sonar.go.tests.reportPaths=test-report.json
sonar.go.coverage.reportPaths=coverage.out

# NOTE: Must be the same as "Version" const in server/main.go
sonar.projectVersion=2.1.0

# Multicriteria Issue Exclusions
sonar.issue.ignore.multicriteria=migrations,vueAutocomplete,piniaActions

# 1. Ignore string duplication and complexity on immutable database migrations
sonar.issue.ignore.multicriteria.migrations.ruleKey=go:S1192,go:S3776
sonar.issue.ignore.multicriteria.migrations.resourceKey=server/internal/migrations/**

# 2. Ignore HTML autocomplete warnings on custom PrimeVue components
sonar.issue.ignore.multicriteria.vueAutocomplete.ruleKey=Web:S6840,vue:S6840
sonar.issue.ignore.multicriteria.vueAutocomplete.resourceKey=webui/src/components/**

# 3. Allow standalone actions inside Pinia setup stores
sonar.issue.ignore.multicriteria.piniaActions.ruleKey=javascript:S3513
sonar.issue.ignore.multicriteria.piniaActions.resourceKey=webui/src/stores/**
